services:
  # docker inspect voxacommunications-backend-registry-mysql-1 | grep IPAddress
  # network mode:voxacommunications-backend_default
  registry:
    image: voxacommunications-registry:latest
    container_name: voxacommunications-registry
    #network_mode: "host"
    depends_on:
      - registry-mysql
    environment:
      - MYSQL_HOST=172.29.0.4
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=registry
      - MYSQL_PORT=3306
      - KEY=${REGISTRY_KEY}
      - PORT=8000
      - API_URL=http://127.0.0.1:8000
    ports:
      - "8000:8000/tcp"
      - "8000:8000/udp"
    volumes:
      - ./logs:/logs:ro
  cstellaris-node:
    image: stellaris-node:classic
    container_name: cstellaris-node
    tty: true
    restart: unless-stopped
    environment:
      - DATABASE_PATH=./data/database
      - NODE_HOST=0.0.0.0
      - NODE_PORT=5433
      - DEFAULT_NODES=https://cstellaris-node.connor33341.dev
      - ENABLE_RATE_LIMITING=true
    ports:
      - "5433:5433"
    volumes:
      - ./cstellaris-data:/app/data:rw

  stellaris-node:
    image: stellaris-node:latest
    container_name: stellaris-node
    tty: true
    restart: unless-stopped
    environment:
      - DATABASE_PATH=./data/database
      - NODE_HOST=0.0.0.0
      - NODE_PORT=5432
      - DEFAULT_NODES=https://stellaris-node.connor33341.dev
      - ENABLE_RATE_LIMITING=true
    ports:
      - "5432:5432"
    volumes:
      - ./stellaris-data:/app/data:rw
  registry-mysql:
    image: mysql
    environment:
      - MYSQL_USER=user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=registry
    ports:
      - "3308:3306"
    #volumes:
    #  - ./mysql-data:/var/lib/mysql
  node:
    image: voxacommunications-netnode:latest
    container_name: voxacommunications-netnode
    environment:
      - email=${EMAIL}
      - password=${PASSWORD}
      - code=${CODE}
      - env=production
    ports:
      - "8999:8999/tcp"
      - "8999:8999/udp"
      - "9998:9998"
    volumes:
      - ./config:/app/config
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: voxa-cloudflare-tunnel
    network_mode: "host"
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - registry
